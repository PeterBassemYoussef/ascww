name: Deploy ASCWW React App to cPanel

on:
  push:
    branches:
      - live # or master, depending on your default branch
  workflow_dispatch:  # enables manual trigger

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci  # faster & safer than npm install in CI

      - name: Build React App
        run: npm run build
        # env:
          # REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL }}  # ← uncommented
          # Add other REACT_APP_ variables here if needed

      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          known_hosts: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
          if_key_exists: replace

      - name: Deploy with Rsync
        run: |
          rsync -avz --delete \
            -e "ssh -p ${{ secrets.CPANEL_SSH_PORT }}" \
            ./dist/ \
            ${{ secrets.CPANEL_SSH_USERNAME }}@${{ secrets.CPANEL_SSH_HOST }}:/home/${{ secrets.CPANEL_SSH_USERNAME }}/public_html/staging.ascww.org/