name: Deploy ASCWW React App to cPanel

on:
  push:
    branches:
      - live # or master, depending on your default branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install

      - name: Build React App
        run: npm run build
        #env:
          # REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL }}
          # Add other REACT_APP_ variables here if needed

      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          known_hosts: 'just-a-placeholder-so-we-dont-get-errors' # This will be replaced by ssh-keyscan

      - name: Add Known Hosts
        run: ssh-keyscan -H ${{ secrets.CPANEL_SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy with Rsync
        run: rsync -avz --delete ./build/ ${{ secrets.CPANEL_SSH_USERNAME }}@${{ secrets.CPANEL_SSH_HOST }}:/home/${{ secrets.CPANEL_SSH_USERNAME }}/public_html/staging.ascww.org/ # This is your subdomain's directory